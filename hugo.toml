baseURL = "https://vosdom.space/"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = true
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[taxonomies]
  tag = "tags"

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    title = "Vitaly"

    [[languages.en.menu.main]]
      identifier = "blog"
      name = "Blog"
      pageRef = "/blog"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      pageRef = "/projects"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      pageRef = "/about"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "contact"
      name = "Contact"
      pageRef = "/contact"
      weight = 40

    [languages.en.params]
      description = "Vitaly — notes on web dev, work, and the games, shows, and books I'm spending time with."
      [languages.en.params.homeInfoParams]
        Title = "Hi, I'm Vitaly."
        Content = "I tinker with code in my spare time and write here about web dev, work, and the games, shows, and books I'm spending time with. The blog is the most likely place to find something new."

  [languages.ru]
    label = "Русский"
    locale = "ru-ru"
    weight = 2
    title = "Виталий"

    [[languages.ru.menu.main]]
      identifier = "blog"
      name = "Блог"
      pageRef = "/blog"
      weight = 10
    [[languages.ru.menu.main]]
      identifier = "projects"
      name = "Проекты"
      pageRef = "/projects"
      weight = 20
    [[languages.ru.menu.main]]
      identifier = "about"
      name = "Обо мне"
      pageRef = "/about"
      weight = 30
    [[languages.ru.menu.main]]
      identifier = "contact"
      name = "Контакты"
      pageRef = "/contact"
      weight = 40

    [languages.ru.params]
      description = "Виталий — заметки о веб-разработке, работе, играх, сериалах и книгах, на которые уходит свободное время."
      [languages.ru.params.homeInfoParams]
        Title = "Привет, я Виталий."
        Content = "В свободное время копаюсь в коде и пишу здесь о веб-разработке, работе и о тех играх, фильмах, сериалах и книгах, которыми увлёкся. Чаще всего что-то новое появляется в блоге."

[params]
  env = "production"
  author = "Vitaly"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  DateFormat = "2006-01-02"
  mainSections = ["blog"]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/vi7ali"

  [[params.socialIcons]]
    name = "telegram"
    url = "https://t.me/vitaly_osipov"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:vi7ali@gmail.com"

  [params.assets]
    disableHLJS = false
    favicon = "/favicon.ico"
